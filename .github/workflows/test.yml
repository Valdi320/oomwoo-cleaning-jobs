name: Pure-Python regression
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests without ROS or extra dependencies
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Simulated end-to-end job with checkpoint interruption
        run: PYTHONPATH=src python -m oomwoo_cleaning_jobs.demo
